[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-engineering-toolkit"
version = "1.1.1"
description = "Photographic optics and camera engineering calculations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4", "streamlit==1.65.0", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
cet = "cet.cli:main"

[tool.setuptools.packages.find]
include = ["cet*"]

[tool.setuptools.package-data]
cet = ["data/*.json", "data/fonts/*.ttf", "data/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
