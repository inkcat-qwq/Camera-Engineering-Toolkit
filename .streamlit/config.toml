[theme]
primaryColor = "#168B99"
font = "sans serif"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F3F8"
textColor = "#243246"
primaryColor = "#168B99"

[theme.dark]
backgroundColor = "#0E1623"
secondaryBackgroundColor = "#182334"
textColor = "#E2EAF4"
primaryColor = "#45B9C5"

[server]
headless = true
maxUploadSize = 2

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Trusted own-app origins for the session-local native-theme bridge.
allowedOrigins = ["http://localhost:*", "http://127.0.0.1:*", "https://camera-engineering-toolkit.streamlit.app", "https://share.streamlit.io"]
